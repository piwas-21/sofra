# Tenant registry fixture for the E2E suite (TENANT_REGISTRY_PATH points here).
#
# Why a fixture instead of the real deploy-repo file: the suite has to be able to
# assert "this slug is TAKEN", which needs a known-occupied slug. Reading the
# sibling deploy repo would make the assertion depend on a file another repo is
# free to change, and CI has no deploy checkout at all — where an ABSENT registry
# is not a neutral condition: since O2 an unreadable registry makes the signup
# fail closed (leadOnly), so without this file the happy-path spec would assert
# an account was created and correctly get a lead instead.
#
# Deliberately minimal — only the fields lib/tenant-registry.ts requires, plus
# the two slugs the specs care about. Not a copy of production; nothing here is
# provisioned by anything.
version: 1
tenants:
  # Stands in for a live tenant, so `taken` has something to collide with.
  e2e-occupied:
    name: E2E Occupied Restaurant
    status: active
    managed: scripts
    box: staging
    domain: e2e-occupied.example.test
    domain_mode: subdomain
    db: tenant_e2e_occupied
    languages: [en]
    modules: [core]
    template: classic
  # A retired entry, so a spec can tell "in the registry" from "selectable".
  e2e-retired:
    name: E2E Retired Restaurant
    status: retired
    managed: scripts
    box: staging
    domain: e2e-retired.example.test
    domain_mode: subdomain
    db: tenant_e2e_retired
    languages: [en]
    modules: [core]
  # The two Stripe shapes /admin/tenants has to tell apart (SOFRA-PAYMENTS-PLAN
  # §9 P3). Nothing here is provisioned; the ids are fixture strings.
  e2e-card:
    name: E2E Card Restaurant
    status: active
    managed: scripts
    box: staging
    domain: e2e-card.example.test
    domain_mode: subdomain
    db: tenant_e2e_card
    languages: [en]
    modules: [core, online-payments]
    stripe_account: acct_1E2eFixtureCard
  # Bought the module, has no account. P1 makes this unreachable from the
  # generator; a hand-edited registry PR can still produce it, and the box then
  # refuses the whole provision — so the page has to shout about it.
  e2e-unpaired:
    name: E2E Unpaired Restaurant
    status: provisioning
    managed: scripts
    box: staging
    domain: e2e-unpaired.example.test
    domain_mode: subdomain
    db: tenant_e2e_unpaired
    languages: [en]
    modules: [core, online-payments]
  # The reseller's own view of a tenant they sold (SOFRA-PARTNER-PLAN §9). Its OWN
  # slugs rather than a share of `e2e-card`/`e2e-occupied`: the owner specs repoint a
  # plan onto those, and `TenantBilling.tenantSlug` is UNIQUE — so a shared slug is a
  # cross-spec race under parallel workers, not a saving.
  e2e-partner-live:
    name: E2E Partner Live Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-live.example.test
    domain_mode: subdomain
    db: tenant_e2e_partner_live
    currency: CHF
    languages: [en, fr]
    modules: [core, reservations, online-payments]
    template: craft
    stripe_account: acct_1E2ePartnerLive
  e2e-partner-note:
    name: E2E Partner Note Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-note.example.test
    domain_mode: subdomain
    db: tenant_e2e_partner_note
    languages: [en]
    modules: [core]
  # The free period (SOFRA-PARTNER-FLEXIBILITY-PLAN T-b). TWO slugs, one per state,
  # for the same reason the pair above have their own: `TenantBilling.tenantSlug` is
  # UNIQUE, so two specs sharing a slug is a cross-spec race under parallel workers.
  e2e-partner-trial:
    name: E2E Partner Trial Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-trial.example.test
    domain_mode: subdomain
    db: tenant_e2e_partner_trial
    languages: [en]
    modules: [core]
  e2e-partner-extend:
    name: E2E Partner Extend Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-extend.example.test
    domain_mode: subdomain
    db: tenant_e2e_partner_extend
    languages: [en]
    modules: [core]
  e2e-partner-noextend:
    name: E2E Partner No-Extend Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-noextend.example.test
    domain_mode: subdomain
    db: tenant_e2e_partner_noextend
    languages: [en]
    modules: [core]
  # D2 — the per-client domain chooser (SOFRA-PARTNER-FLEXIBILITY-PLAN). Its OWN slug
  # and plan, like every pair above: `TenantBilling.tenantSlug` is UNIQUE, and two
  # specs sharing one is a cross-spec race under parallel workers, not a saving. This
  # one stands in for a client that is ALREADY a tenant, which is the state where the
  # chooser must disappear (the domain is baked into a per-domain image by then).
  e2e-domain-live:
    name: E2E Domain Live Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-domain-live.example.test
    domain_mode: subdomain
    db: tenant_e2e_domain_live
    languages: [en]
    modules: [core]
  # A partner-zone entry, so `lib/tenant-registry.ts` parsing `base_domain` is asserted
  # against a real fixture rather than only in a unit test. Nothing here is provisioned.
  e2e-partner-zone:
    name: E2E Partner Zone Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-zone.solutioneva.example
    domain_mode: subdomain
    base_domain: solutioneva.example
    db: tenant_e2e_partner_zone
    languages: [en]
    modules: [core]
  e2e-partner-expired:
    name: E2E Partner Expired Trial Restaurant
    status: active
    managed: sofra
    box: staging
    domain: e2e-partner-expired.example.test
    domain_mode: subdomain
    db: tenant_e2e_partner_expired
    languages: [en]
    modules: [core]
  # Tenant backups (ADR-014). Their OWN box id, `e2e-backup-box`, and it is
  # load-bearing rather than tidy: the inventory push is WHOLE-BOX and prunes
  # what it does not list, so a spec that pushed against `staging` would delete
  # any other spec's artifacts on the way past. And their OWN slugs and plans,
  # for the reason every pair above has its own — `TenantBilling.tenantSlug` is
  # UNIQUE, so a shared slug is a cross-spec race under parallel workers.
  #
  # One slug per state the page has to tell apart: a fresh copy, a copy old
  # enough to be unprotected, a tenant with no copy at all, a tenant whose only
  # copy sits on the box that runs it, and a lapsed trial. The DEPARTED case has
  # deliberately NO entry here — that is the point of it.
  e2e-backup-fresh:
    name: E2E Backup Fresh Restaurant
    status: active
    managed: sofra
    box: e2e-backup-box
    domain: e2e-backup-fresh.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_fresh
    languages: [en]
    modules: [core]
  e2e-backup-stale:
    name: E2E Backup Stale Restaurant
    status: active
    managed: sofra
    box: e2e-backup-box
    domain: e2e-backup-stale.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_stale
    languages: [en]
    modules: [core]
  e2e-backup-none:
    name: E2E Backup Never Restaurant
    status: active
    managed: sofra
    box: e2e-backup-box
    domain: e2e-backup-none.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_none
    languages: [en]
    modules: [core]
  # `managed: legacy` — the one tenant shape the box NEVER dumps on its own
  # (ADR-006). Here because the page's answer for it is not a judgement about age
  # but a statement about what covers it instead, and that was wrong in production
  # on the alarm's first run (ADR-014 D5).
  e2e-backup-legacy:
    name: E2E Backup Cluster-Dump Restaurant
    status: active
    managed: legacy
    box: e2e-backup-box
    domain: e2e-backup-legacy.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_legacy
    languages: [en]
    modules: [core]
  e2e-backup-local:
    name: E2E Backup Local-Only Restaurant
    status: active
    managed: sofra
    box: e2e-backup-box
    domain: e2e-backup-local.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_local
    languages: [en]
    modules: [core]
  # Provisioned "this afternoon": one local dump, nothing off box, and tonight's
  # ship has not run. The row the off-box alarm must stay SILENT about.
  e2e-backup-new:
    name: E2E Backup Brand New Restaurant
    status: active
    managed: sofra
    box: e2e-backup-box
    domain: e2e-backup-new.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_new
    languages: [en]
    modules: [core]
  e2e-backup-lapsed:
    name: E2E Backup Lapsed Trial Restaurant
    status: active
    managed: sofra
    box: e2e-backup-box
    domain: e2e-backup-lapsed.example.test
    domain_mode: subdomain
    db: tenant_e2e_backup_lapsed
    languages: [en]
    modules: [core]
