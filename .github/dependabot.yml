# Dependabot — SECURITY updates only (workspace CLAUDE.md standing decision:
# "Dependabot PRs are paused").
#
# `open-pull-requests-limit: 0` is the documented way to switch OFF version-update
# PRs while leaving Dependabot SECURITY updates fully on — which is why the file
# stays here instead of being deleted. The CVE gate is unchanged: security-audit.yml
# still runs its scanners on schedule, and SonarCloud is untouched.
#
# Why: the decision not to merge these PRs was already taken, but the bot was still
# being paid to open them — measured on this (private, billed) repo, 21 CI runs on
# dependabot/* branches in the 16 days to 2026-08-16, for six PRs (#114, #58, #57,
# #55, #54, #53) that sat unmerged and rebasing. This makes the status quo honest
# rather than changing it. Version drift is the accepted cost, and it was already
# accruing.
#
# To resume version updates: raise the limits below (5 npm / 3 actions were the
# previous values) in a PR that also says who will triage them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Companion packages move with the trio (Gemini on frontend #141):
      # a @types/react major against an older react breaks tsc.
      # Majors of the framework trio are coordinated upgrades (CLAUDE.md §9 class).
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 0  # version-update PRs off; security updates unaffected
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
