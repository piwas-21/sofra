name: go-live-cron

# Announces a newly-live tenant to its owner (POST /api/cron/go-live on the live
# sofra). The sweep only mails a tenant whose own /api/health answers, and only ONCE
# ever (audit-row marker), so this workflow is safe to merge and safe to re-run.
#
# Setup (one-time, owner): the same shared bearer secret the retention cron uses —
# must equal CRON_SECRET in the box env for the request to authorize:
#   gh secret set CRON_SECRET -R piwas-21/sofra
# Until it is set, the job logs a warning and exits cleanly (sends nothing).

on:
  schedule:
    # Every 15 minutes. Provisioning takes ~15 min, and this is the message a paying
    # customer is waiting on — a daily sweep would mean someone paid in the morning
    # and heard nothing until the next day.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # manual run for testing

permissions:
  contents: read

concurrency:
  group: go-live-cron
  cancel-in-progress: false

jobs:
  sweep:
    name: announce newly-live tenants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/cron/go-live
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::CRON_SECRET not set — skipping (endpoint would 401)."
            exit 0
          fi
          resp=$(curl -sS --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST "https://sofrapiwas.com/api/cron/go-live" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -w "\n%{http_code}")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::go-live sweep failed (HTTP $code)"
            exit 1
          fi
